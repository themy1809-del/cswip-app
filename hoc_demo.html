h2{font-size:19px;margin:6px 0 14px;line-height:1.35}
h3{font-size:15px;margin:18px 0 8px;color:var(--acc)}
p{margin-bottom:12px}
.ask{background:linear-gradient(135deg,rgba(88,166,255,.12),rgba(88,166,255,.04));border:1px solid rgba(88,166,255,.3);border-radius:12px;padding:16px;margin-bottom:14px}
.ask b{color:var(--blu);display:block;margin-bottom:8px;font-size:14px}
.ask p{margin-bottom:0;font-size:17px}
.hint{color:var(--mut);font-size:13px;margin-top:10px;font-style:italic}
.ana{background:rgba(63,185,80,.09);border-left:3px solid var(--grn);border-radius:0 10px 10px 0;padding:14px 16px;margin:14px 0}
.ana b{color:var(--grn);display:block;margin-bottom:6px;font-size:13px;letter-spacing:.3px}
.ana p{margin:0}
.warn{background:rgba(255,138,61,.09);border-left:3px solid var(--acc);border-radius:0 10px 10px 0;padding:14px 16px;margin:14px 0}
.warn b{color:var(--acc);display:block;margin-bottom:6px;font-size:13px}
.warn p{margin:0}
svg{width:100%;height:auto;display:block;margin:6px 0 14px;background:var(--card2);border-radius:12px;padding:10px}
.terms{border-top:1px dashed var(--line);margin-top:18px;padding-top:14px}
.terms .lb{color:var(--mut);font-size:12px;margin-bottom:8px}
.chip{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;margin:0 6px 6px 0;font-size:13px}
.chip b{color:var(--blu);font-weight:600}
.chip span{color:var(--mut)}
button{font:inherit;cursor:pointer;border:0;border-radius:11px;padding:13px 20px;font-weight:600}
.btn{background:var(--acc);color:#1a0d04;width:100%}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.row{display:flex;gap:10px;margin-top:6px}
.row button{flex:1}
.hide{display:none}
.opt{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:11px;padding:13px 15px;margin-bottom:9px;font-weight:400;line-height:1.45}
.opt:hover{border-color:var(--acc)}
.opt.ok{border-color:var(--grn);background:rgba(63,185,80,.14)}
.opt.bad{border-color:#f85149;background:rgba(248,81,73,.13)}
.fb{border-radius:11px;padding:13px 15px;margin-top:4px;font-size:14px;line-height:1.55}
.fb.ok{background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.35)}
.fb.bad{background:rgba(248,81,73,.09);border:1px solid rgba(248,81,73,.35)}
.score{font-size:40px;font-weight:800;color:var(--acc);text-align:center;margin:10px 0}

svg text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
</style>
</head>
<body>

<header>
  <span class="kicker">BẢN THỬ · CÁCH HỌC MỚI</span>
  <h1>Chương 2 — Quá trình hàn</h1>
  <p class="sub">6 ý lớn. Mỗi ý: đoán trước → xem hình → hiểu → nhớ.</p>
</header>

<div class="dots" id="dots"></div>
<div id="stage"></div>

<p class="note">Đây là bản thử để bạn xem cách học này có vào đầu dễ hơn không.<br>Nếu được, mình làm tiếp cho cả 18 chương.</p>

<script>

  <path d="M120 38 L150 70" stroke="#f85149" stroke-width="2"/><polygon points="150,70 141,60 154,61" fill="#f85149"/>

  <text x="440" y="30" fill="#f85149" font-size="13">✕ Hơi ẩm</text>
 </svg>`,
 body:`<p>Hàn hồ quang chỉ là: dùng tia lửa điện <b>nấu chảy</b> mép hai miếng thép cho chúng hòa vào nhau, nguội lại thì thành một khối.</p>
 <p>Nhưng thép lỏng ở 1500°C <b>hút ôxy và nitơ trong không khí như miếng bọt biển hút nước</b>. Hút vào rồi, khi nguội chúng biến thành bọt khí và hạt cứng giòn nằm lại trong mối hàn.</p>
 <p>Vì vậy <b>mọi quá trình hàn đều phải che vũng hàn lại</b>. Đó là lý do tồn tại của thuốc bọc que, của bình khí, của lớp thuốc hạt. Không có cái nào là "cho đẹp" cả — tất cả đều là <b>cái vung đậy nồi</b>.`,
 ana:{t:"NEO VÀO ĐỜI THƯỜNG",p:"Vũng hàn = nồi canh đang sôi. Lớp bảo vệ = cái vung. Mở vung ra thì bụi rơi vào — hàn mà mất lớp bảo vệ thì <b>rỗ khí</b> rơi vào mối hàn. Nhớ đúng một câu này là hiểu được cả chương."},
 terms:[["weld pool","vũng hàn"],["shielding","sự bảo vệ, che chắn"],["porosity","rỗ khí"],["arc","hồ quang"]],
 recall:"Vì sao vũng hàn bắt buộc phải được che chắn?"
},
{

 ask:"Nếu có 4 cách đậy vung khác nhau, bạn đoán cách nào dùng được ngoài trời gió to?",
 hint:"Gió thổi bay được cái gì, và không thổi bay được cái gì?",

   <text x="560" y="134" fill="#c9a227" font-size="12" text-anchor="middle">VÙI trong thuốc hạt</text>
  </g>
  <rect x="14" y="160" width="612" height="124" rx="10" fill="#1c2430" stroke="#2a3441"/>
  <text x="30" y="186" fill="#3fb950" font-size="14" font-weight="700">XỈ (thể rắn) — gió KHÔNG thổi bay được</text>
  <text x="30" y="208" fill="#e6edf3" font-size="13">→ MMA và SAW dùng được ngoài công trường, ngoài gió.</text>
  <text x="30" y="240" fill="#f85149" font-size="14" font-weight="700">KHÍ (thể khí) — gió THỔI BAY MẤT</text>
  <text x="30" y="262" fill="#e6edf3" font-size="13">→ MIG/MAG và TIG phải che chắn gió, hoặc chỉ hàn trong xưởng.</text>
 </svg>`,
 body:`<p>Bốn quá trình trong đề thi chỉ khác nhau ở <b>cách đậy vung</b> và <b>que có tan hay không</b>:</p>
 <p><b>MMA</b> — que sắt bọc một lớp thuốc. Thuốc cháy thành xỉ phủ lên trên. Que tự tan thành kim loại đắp.<br>
 <b>MIG/MAG</b> — dây sắt chạy ra liên tục, khí thổi ra từ chụp bao quanh. Dây tan.<br>
 <b>TIG</b> — que vonfram <b>không tan</b> (chỉ để sinh hồ quang), khí bảo vệ, muốn đắp thì cầm que phụ chấm vào.<br>
 <b>SAW</b> — dây chạy tự động, cả hồ quang <b>chìm nghỉm</b> dưới đống thuốc hạt, không nhìn thấy tia lửa.</p>`,
 ana:{t:"CÁCH NHỚ",p:"Xỉ là <b>chất rắn</b> — gió không thổi bay. Khí là <b>chất khí</b> — gió thổi bay ngay. Nên hỏi 'hàn ngoài trời gió dùng gì' thì đáp án luôn là loại có <b>xỉ</b>: MMA. Không cần học thuộc, cứ hỏi lại 'gió thổi bay được không'."},
 terms:[["MMA / SMAW","hàn que bọc thuốc"],["MIG / MAG","hàn dây + khí"],["TIG / GTAW","hàn điện cực vonfram"],["SAW","hàn hồ quang chìm"],["slag","xỉ"],["consumable","tan được / vật liệu tiêu hao"]],
 recall:"Hàn ngoài công trường có gió thì chọn quá trình nào, và vì sao?"
},
{
 n:"Ý LỚN 3 / 6",
 t:"Nguồn hàn CC và CV — cái vòi nước và cái bơm",
 ask:"Thợ cầm que bằng tay. Tay người thì luôn run lên xuống. Nếu tay run làm hồ quang lúc dài lúc ngắn, bạn muốn máy giữ chặt cái gì?",
 hint:"Giữ chặt dòng điện, hay giữ chặt điện áp?",
 svg:`<svg viewBox="0 0 640 290">
  <rect x="12" y="12" width="300" height="266" rx="12" fill="#1c2430" stroke="#2a3441"/>
  <text x="162" y="40" fill="#ff8a3d" font-size="15" font-weight="700" text-anchor="middle">CC — giữ chặt DÒNG</text>

  <path d="M72 100 Q170 118 205 210" stroke="#ff8a3d" stroke-width="3.5" fill="none"/>

  <text x="212" y="104" fill="#3fb950" font-size="12">tay run</text>
  <text x="212" y="120" fill="#3fb950" font-size="12">lên xuống</text>
  <path d="M150 128 L196 176" stroke="#3fb950" stroke-width="2"/><polygon points="196,176 185,170 192,163" fill="#3fb950"/>
  <text x="162" y="268" fill="#e6edf3" font-size="13" text-anchor="middle">→ dòng gần như KHÔNG ĐỔI</text>

  <path d="M420 172 L410 150" stroke="#3fb950" stroke-width="2"/><polygon points="410,150 409,162 418,157" fill="#3fb950"/>

  <text x="478" y="268" fill="#e6edf3" font-size="13" text-anchor="middle">→ điện áp KHÔNG ĐỔI</text>
 </svg>`,
 body:`<p>Đây là câu hỏi ra đề nhiều nhất chương này, và nó chỉ là một ý duy nhất.</p>
 <p><b>Người cầm tay thì tay run.</b> Tay run làm hồ quang lúc dài lúc ngắn. Nếu dòng điện cũng nhảy theo, mối hàn lúc ngấu sâu lúc ngấu nông — hỏng. Nên máy phải <b>giữ chặt dòng điện</b> dù hồ quang dài ngắn thế nào. Đó là <b>CC</b> — dùng cho <b>MMA và TIG</b>, hai quá trình cầm tay.</p>
 <p><b>Máy tự cấp dây thì không có tay nào run</b>, nhưng có chuyện khác: dây chạy ra đều đặn, nếu thợ đưa mỏ hàn lại gần thì dây thừa ra. Ở chế độ <b>CV</b>, dây gần vật hơn → dòng vọt lên → dây <b>cháy cụt nhanh hơn</b> → hồ quang tự dài trở lại. Máy tự sửa, không cần thợ. Đó là <b>CV</b> — dùng cho <b>MIG/MAG và SAW dây nhỏ</b>.</p>`,
 ana:{t:"NEO VÀO ĐỜI THƯỜNG",p:"<b>CC = vòi nước vặn cứng một mức.</b> Bạn đưa cái ca lên cao xuống thấp (hồ quang dài ngắn), nước vẫn chảy đúng bằng đó. → Tay người cầm → CC → <b>MMA, TIG</b>.<br><br><b>CV = máy tự bù.</b> Đút dây vào sâu hơn thì nó ăn dòng mạnh hơn, cháy cụt nhanh hơn, tự cân bằng lại. → Máy cấp dây → CV → <b>MIG/MAG, SAW</b>."},
 warn:{t:"BẪY ĐỀ THI",p:"Đề rất hay hỏi ngược: <i>\"self-adjusting arc (hồ quang tự điều chỉnh) thuộc loại nguồn nào?\"</i> — Đáp án là <b>CV</b>, vì chỉ CV mới có khả năng tự bù đó. CC không tự điều chỉnh, chính thợ phải giữ tay."},
 terms:[["constant current (CC)","nguồn dòng không đổi"],["drooping","đặc tính dốc (của CC)"],["constant voltage (CV)","nguồn áp không đổi"],["flat characteristic","đặc tính phẳng (của CV)"],["self-adjusting arc","hồ quang tự điều chỉnh"]],
 recall:"MMA dùng nguồn CC hay CV? Vì sao lại là loại đó?"
},
{

 ask:"Nếu hàn tấm thép dày, bạn muốn nhiệt dồn vào TẤM hay dồn vào QUE?",
 hint:"Tấm dày thì cần nhiệt ở đâu để ngấu sâu?",

 body:`<p>Chỉ cần nhớ <b>một quy tắc duy nhất</b>: trong hàn hồ quang một chiều, <b>khoảng 2/3 nhiệt sinh ra ở cực DƯƠNG (+), 1/3 ở cực ÂM (−)</b>. Mọi câu hỏi về cực tính đều suy ra từ đây.</p>
 <p>Đặt <b>cực dương vào QUE</b> (gọi là DCEP) → nhiệt dồn vào que → que tan nhanh, tấm ngấu nông hơn. Đặt <b>cực dương vào TẤM</b> (gọi là DCEN) → nhiệt dồn vào tấm → <b>ngấu sâu</b>.</p>
 <p>Riêng hàn <b>nhôm bằng TIG</b> phải dùng <b>dòng xoay chiều AC</b>: nhôm có màng ôxit nóng chảy ở 2050°C phủ trên bề mặt (nhôm thì chảy ở 660°C), phải có nửa chu kỳ để "bắn vỡ" màng đó ra, nửa chu kỳ còn lại mới nấu chảy nhôm.</p>`,

 body:`<p>"Nhiệt lượng đường hàn" nghe to tát nhưng chỉ là: <b>một milimét mối hàn nhận được bao nhiêu nhiệt</b>.</p>
 <p>Ba thứ quyết định nó: <b>dòng điện</b>, <b>điện áp</b>, và <b>tốc độ đi</b>. Hai cái đầu ở <b>tử số</b> — tăng lên thì nhiệt tăng. Tốc độ ở <b>mẫu số</b> — <b>đi nhanh thì nhiệt giảm</b>. Chỉ cần nhớ vị trí trên dưới của tốc độ là làm được mọi câu hỏi dạng này.</p>
 <p>Vì sao thanh tra viên quan tâm? Vì nhiệt lượng quyết định <b>tốc độ nguội</b>, mà tốc độ nguội quyết định <b>tổ chức kim loại</b>. Nguội quá nhanh (nhiệt lượng thấp) → thép biến thành tổ chức <b>cứng và giòn</b>, cộng thêm hydro là <b>nứt nguội</b>. Nguội quá chậm (nhiệt lượng cao) → hạt kim loại lớn lên, <b>độ dai giảm</b>. Vì vậy WPS luôn quy định một <b>khoảng</b> nhiệt lượng, không phải một con số.</p>`,

 body:`<p>Trong MIG/MAG, giọt kim loại từ dây đi sang vũng hàn theo mấy kiểu khác nhau, và kiểu nào là do <b>bạn đặt dòng và điện áp cao hay thấp</b>.</p>
 <p><b>Dip (ngắn mạch)</b> — dòng và áp thấp. Dây chạm hẳn vào vũng hàn, chập mạch, giọt kim loại tách ra, hồ quang cháy lại. Lặp lại 50–200 lần mỗi giây. Vì nhiệt thấp nên <b>hàn được tấm mỏng và mọi tư thế</b> (kể cả hàn ngược trần), nhưng chính vì nhiệt thấp mà đem hàn <b>tấm dày thì dễ thiếu ngấu</b>.</p>
 <p><b>Spray (phun)</b> — dòng và áp cao. Kim loại bay sang thành <b>hạt rất nhỏ như sương</b>, không chạm vũng. Nhiệt cao nên <b>ngấu sâu, đắp nhanh</b>, nhưng vũng hàn to và lỏng như nước nên <b>chỉ hàn được tư thế bằng và ngang</b> — ngửa lên thì nó chảy xuống.</p>`,

}

const QUIZ=[
 {q:"MMA hàn được ngoài trời có gió, còn MIG/MAG thì không. Vì sao?",
  o:["MMA dùng dòng điện lớn hơn","MMA được bảo vệ bằng XỈ (chất rắn), gió không thổi bay được","MMA không cần bảo vệ vũng hàn","MIG/MAG chỉ dùng cho nhôm"],a:1,
  e:"Xỉ là chất rắn phủ lên mối hàn nên gió không thổi bay. Khí bảo vệ là chất khí, gió thổi bay ngay lập tức."},
 {q:"Vì sao MMA và TIG dùng nguồn CC (dòng không đổi)?",
  o:["Vì hai quá trình này rẻ tiền hơn","Vì thợ CẦM TAY, tay run làm hồ quang dài ngắn — dòng phải giữ nguyên","Vì chúng chỉ hàn được thép","Vì chúng không cần khí bảo vệ"],a:1,
  e:"Tay người luôn run. Nếu dòng nhảy theo chiều dài hồ quang thì độ ngấu lúc sâu lúc nông. CC giữ dòng gần như không đổi — giống vòi nước vặn cứng một mức."},
 {q:"Muốn mối hàn ngấu SÂU vào tấm thì làm thế nào?",
  o:["Đặt cực DƯƠNG vào tấm (DCEN)","Đặt cực ÂM vào tấm","Dùng dòng xoay chiều","Giảm dòng điện xuống thấp nhất"],a:0,
  e:"Khoảng 2/3 nhiệt sinh ra ở cực DƯƠNG. Muốn tấm nóng hơn để ngấu sâu thì cho cực dương vào tấm — đó chính là DCEN (điện cực mang cực âm)."},
 {q:"Thợ hàn đi NHANH hơn thì nhiệt lượng đường hàn thay đổi thế nào?",
  o:["Tăng lên","Giảm xuống","Không đổi","Tùy loại que hàn"],a:1,
  e:"Tốc độ nằm ở MẪU SỐ của công thức, nên đi nhanh thì nhiệt lượng giảm. Giống rang lạc: đảo nhanh thì mỗi hạt ăn ít nhiệt hơn."},
 {q:"Dip transfer (chuyển dịch ngắn mạch) có rủi ro gì trên tấm dày?",
  o:["Cháy thủng","Thiếu ngấu, vì nhiệt lượng quá thấp","Rỗ khí do gió","Nứt nóng"],a:1,

];

let i=0, phase='ask', qi=0, score=0, answered=false;
const stage=document.getElementById('stage'), dotsEl=document.getElementById('dots');

function dots(){
  dotsEl.innerHTML=IDEAS.map((_,k)=>`<div class="dot ${k<i?'done':k===i?'on':''}"></div>`).join('')+`<div class="dot ${phase==='quiz'||phase==='end'?'on':''}"></div>`;
}
function esc(s){return s;}

function render(){
  dots();
  if(phase==='ask'){
    const d=IDEAS[i];
    stage.innerHTML=`<div class="card">
      <div class="idea-n">${d.n}</div>
      <h2>${d.t}</h2>
      <div class="ask"><b>❓ ĐOÁN THỬ TRƯỚC ĐÃ</b><p>${d.ask}</p><div class="hint">${d.hint}</div></div>
      <button class="btn" onclick="reveal()">Tôi đoán xong — xem đáp án</button>
    </div>`;
    window.scrollTo(0,0);
  } else if(phase==='learn'){
    const d=IDEAS[i];
    stage.innerHTML=`<div class="card">
      <div class="idea-n">${d.n}</div>
      <h2>${d.t}</h2>
      ${d.svg}
      ${d.body}
      <div class="ana"><b>${d.ana.t}</b><p>${d.ana.p}</p></div>
      ${d.warn?`<div class="warn"><b>⚠️ ${d.warn.t}</b><p>${d.warn.p}</p></div>`:''}
      <div class="terms"><div class="lb">Thuật ngữ tiếng Anh của ý này — chỉ cần nhận mặt, không cần thuộc lòng:</div>
        ${d.terms.map(t=>`<span class="chip"><b>${t[0]}</b> <span>= ${t[1]}</span></span>`).join('')}</div>
      <h3>🔁 Nhắc lại bằng lời của bạn</h3>
      <p style="color:var(--mut)">${d.recall}</p>
      <p style="color:var(--mut);font-size:13px;font-style:italic">Nói thành tiếng một câu rồi bấm tiếp. Nói ra được mới là nhớ.</p>
      <div class="row">
        ${i>0?`<button class="btn sec" onclick="prev()">← Ý trước</button>`:''}
        <button class="btn" onclick="next()">${i<IDEAS.length-1?'Ý tiếp theo →':'Làm 5 câu kiểm tra →'}</button>
      </div>
    </div>`;
    window.scrollTo(0,0);
  } else if(phase==='quiz'){
    const q=QUIZ[qi];
    stage.innerHTML=`<div class="card">
      <div class="idea-n">KIỂM TRA ${qi+1} / ${QUIZ.length}</div>
      <h2>${q.q}</h2>
      <div id="opts">${q.o.map((o,k)=>`<button class="opt" onclick="pick(${k})">${o}</button>`).join('')}</div>
      <div id="fb"></div>
    </div>`;
    answered=false;
    window.scrollTo(0,0);
  } else {
    const pct=Math.round(score/QUIZ.length*100);
    stage.innerHTML=`<div class="card">
      <div class="idea-n">XONG</div>
      <h2>Bạn đúng ${score}/${QUIZ.length}</h2>
      <div class="score">${pct}%</div>
      <p>${pct>=80?'Rất tốt — cách học này đang vào đầu được.':pct>=60?'Khá ổn. Xem lại ý nào sai rồi làm lại là nhớ.':'Đừng lo — làm lại lần nữa, lần này đọc kỹ phần "neo vào đời thường".'}</p>
      <p style="color:var(--mut);font-size:14px">Cả chương này chỉ có <b>6 ý</b>. Nhớ 6 ý là bạn trả lời được phần lớn câu hỏi về quá trình hàn trong đề thi.</p>
      <div class="row">
        <button class="btn sec" onclick="restart()">Học lại từ đầu</button>
        <button class="btn" onclick="requiz()">Làm lại 5 câu</button>
      </div>
    </div>`;
    window.scrollTo(0,0);
  }
}
function reveal(){phase='learn';render();}
function next(){ if(i<IDEAS.length-1){i++;phase='ask';} else {phase='quiz';qi=0;score=0;} render(); }
function prev(){ if(i>0){i--;phase='learn';} render(); }
function pick(k){
  if(answered)return; answered=true;
  const q=QUIZ[qi], btns=document.querySelectorAll('#opts .opt');
  btns[q.a].classList.add('ok');
  if(k!==q.a) btns[k].classList.add('bad'); else score++;
  document.getElementById('fb').innerHTML=
    `<div class="fb ${k===q.a?'ok':'bad'}"><b>${k===q.a?'✓ Đúng':'✗ Chưa đúng'}</b><br>${q.e}</div>
     <div class="row"><button class="btn" onclick="nq()">${qi<QUIZ.length-1?'Câu tiếp →':'Xem kết quả →'}</button></div>`;
}
function nq(){ if(qi<QUIZ.length-1){qi++;render();} else {phase='end';render();} }
function restart(){i=0;phase='ask';render();}
function requiz(){qi=0;score=0;phase='quiz';render();}
render();
</script>
</body>
</html>
